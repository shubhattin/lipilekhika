# Musl targets default to static linking, but NAPI-RS native bindings are
# shared libraries (cdylib) loaded by Node.js, so we must disable crt-static.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

# A patched copy of GPUI's Linux backend for the desktop app, see desktop-client/vendor/README.md.
# Here and not in the root Cargo.toml: the Python sdist (maturin) ships the root Cargo.toml but
# not desktop-client/, so a [patch] there points at a missing path and the wheel build fails.
[patch.crates-io]
gpui-pre-linux = { path = "desktop-client/vendor/gpui-pre-linux" }
