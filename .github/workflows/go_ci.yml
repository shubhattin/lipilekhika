name: Go Package CI

on:
  push:
    paths:
      - "lipi_script_data/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "packages/go/**"
      - ".github/workflows/go_ci.yml"
      - "test_data/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Generate Test Data
        run: |
          bun install --frozen-lockfile --filter './'
          bun run gen:test-data
      - name: Generate Script Data JSON
        run: |
          bun install --frozen-lockfile --filter './' --filter '@lipilekhika/script-data'
          bun run make-script-data
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/go/lipilekhika/go.mod
      - name: Test
        run: |
          cd packages/go/lipilekhika
          go test -v ./...
      - name: Verify Generated Artifacts Are Current
        run: |
          cd packages/go/lipilekhika
          go run ./cmd/generate-data
          git diff --exit-code data/gob/*.gob
