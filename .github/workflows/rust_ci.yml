name: Rust Package CI

on:
  push:
    paths:
      - 'packages/rust/**'
      - 'lipi_script_data/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'test_data/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust_ci.yml'
  workflow_dispatch:

env:
  # CI builds compile fast: the release profile's fat LTO and single codegen unit (for the
  # published packages) only slow the build down here, the code is still optimized (opt-level 3)
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

# The cargo caches (Swatinem/rust-cache: the dependencies' builds, one per job) are saved on main
# only; the other branches start from main's.
jobs:
  # Plain `cargo build` from a fresh checkout: script data artifacts are committed,
  # so no JS/bun step is needed to build the crate.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: |
          cd packages/rust
          cargo build --release
      # Packages and verify-builds the crate the way `cargo publish` does
      # (no `--no-verify` / `--allow-dirty` needed)
      - name: Package
        run: |
          cd packages/rust
          cargo package -p lipilekhika

  # The committed `src/generated/lipi_data.bin`, `src/scripts.rs` and `src/custom_options.rs`
  # must match what `bun run make-script-data` generates from the current JS data.
  script-data-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt # lipilekhika-datagen formats the generated code

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-script-data
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Generate Script Data
        run: |
          bun install --frozen-lockfile --filter './' --filter '@lipilekhika/script-data'
          bun run make-script-data
      - name: Check generated Rust data is up to date
        run: |
          cd packages/rust
          cargo run -q -p lipilekhika-datagen -- --check
          git diff --exit-code -- src/generated src/scripts.rs src/custom_options.rs

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Generate Test Data
        run: |
          bun install --frozen-lockfile --filter './'
          bun run gen:test-data
      # Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: |
          cd packages/rust
          cargo test --release
          # the idle auto clear of the typing context only exists with `std`
          cargo test --release --features std typing::
