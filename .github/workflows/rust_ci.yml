name: Rust Package CI

on:
  push:
    paths:
      - 'packages/rust/**'
      - 'packages/js/**'
      - 'test_data/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust_ci.yml'
  workflow_dispatch:

jobs:
  # Plain `cargo build` from a fresh checkout: script data artifacts are committed,
  # so no JS/bun step is needed to build the crate.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build
        run: |
          cd packages/rust
          cargo build --release
      # Packages and verify-builds the crate the way `cargo publish` does
      # (no `--no-verify` / `--allow-dirty` needed)
      - name: Package
        run: |
          cd packages/rust
          cargo package -p lipilekhika

  # The committed `src/generated/lipi_data.bin`, `src/scripts.rs` and `src/custom_options.rs`
  # must match what `bun run make-script-data` generates from the current JS data.
  script-data-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt # lipilekhika-datagen formats the generated code

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Generate Script Data
        run: |
          cd packages/js
          bun install
          bun run make-script-data
      - name: Check generated Rust data is up to date
        run: |
          cd packages/rust
          cargo run -q -p lipilekhika-datagen -- --check
          git diff --exit-code -- src/generated src/scripts.rs src/custom_options.rs

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Generate Test Data
        run: |
          bun install
          bun run gen:test-data
      # Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Test
        run: |
          cd packages/rust
          cargo test --release
          # the idle auto clear of the typing context only exists with `std`
          cargo test --release --features std typing::
