name: Release NPM Package

on:
  push:
    tags:
      - 'js-lib@v*'
  workflow_dispatch:
    # This would work only if the package version was already not published to npm
    inputs:
      tag:
        description: "Tag corresponding to the npm version (e.g. js-lib@v1.2.3)"
        required: true
      npm_dist_tag:
        description: "npm dist-tag to publish under (e.g. beta, latest)"
        required: false
        default: "beta"

permissions:
  id-token: write  # Required for OIDC
  contents: read

env:
  NODE_VERSION: '24'
  # the commit that is released: the tag (a `workflow_dispatch` run checks out the given tag, not
  # the branch it was started from)
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Resolve & validate tag
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

      - name: Read package.json version
        id: pkg_version
        shell: bash
        run: |
          VERSION=$(jq -r '.version' packages/js/package.json)
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "Failed to read version from package.json"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.TAG }}"
          VERSION="${{ steps.pkg_version.outputs.VERSION }}"

          EXPECTED="js-lib@v$VERSION"
          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "❌ Tag ($TAG) does not match expected tag ($EXPECTED)"
            exit 1
          fi

          echo "✅ Tag matches package version"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          # `wasm-pack build --profile` needs wasm-pack >= 0.12; pin to the
          # version verified locally instead of floating on `latest`.
          version: 'v0.14.0'

      - name: Generate Test Data
        run: |
          bun install
          bun run gen:test-data

      - name: Generate Script Data
        run: |
          cd packages/js
          bun install
          bun run make-script-data

      - name: Build WASM
        run: |
          cd packages/js/wasm
          wasm-pack build --profile wasm-release --target web

      - name: Build Node Binding
        run: |
          cd packages/js/binding
          ./gen_node_bind.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Build and Test Package
        working-directory: packages/js
        run: |
          bun run build
          bun run check
          bun run test:run

      # the built package (this platform's native binary only): every entry with `import` and
      # `require` under Node and Bun, see `scripts/runtime_check.mjs` and `scripts/package_check.mjs`
      - name: Runtime and Package Checks (dist)
        working-directory: packages/js
        run: |
          bun run test:runtime:dist
          bun run test:package

  build-native:
    needs: test
    strategy:
      matrix:
        include:
          - name: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node_file: index.linux-x64-gnu.node
          - name: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            node_file: index.linux-arm64-gnu.node
          - name: linux-x64-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            node_file: index.linux-x64-musl.node
            use_cross: true
          - name: linux-arm64-musl
            runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            node_file: index.linux-arm64-musl.node
            use_cross: true
          - name: android-arm64
            runner: ubuntu-latest
            target: aarch64-linux-android
            node_file: index.android-arm64.node
            use_cross: true
          - name: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            node_file: index.darwin-x64.node
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            node_file: index.darwin-arm64.node
          - name: windows-x64-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            node_file: index.win32-x64-msvc.node
          - name: windows-arm64-msvc
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            node_file: index.win32-arm64-msvc.node
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild (for cross-compilation)
        if: matrix.use_cross
        shell: bash
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install JS dependencies
        shell: bash
        run: |
          cd packages/js
          bun install

      - name: Build native binding for target
        shell: bash
        run: |
          cd packages/js/binding
          rm -rf pkg
          TARGET="${{ matrix.target }}" CROSS_COMPILE="${{ matrix.use_cross && 'true' || 'false' }}" ./gen_node_bind.sh

      - name: Upload target node artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-binding-${{ matrix.name }}
          path: packages/js/binding/pkg/${{ matrix.node_file }}

  # Builds the package with every native binary, checks it and packs the tarball that is published
  package:
    name: Build and check the package
    runs-on: ubuntu-latest
    needs: [test, build-native]
    env:
      REQUIRED_NATIVE_NODE_FILES: |
        index.linux-x64-gnu.node
        index.linux-arm64-gnu.node
        index.linux-x64-musl.node
        index.linux-arm64-musl.node
        index.android-arm64.node
        index.darwin-x64.node
        index.darwin-arm64.node
        index.win32-x64-msvc.node
        index.win32-arm64-msvc.node

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          # `wasm-pack build --profile` needs wasm-pack >= 0.12; pin to the
          # version verified locally instead of floating on `latest`.
          version: 'v0.14.0'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download native binding artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-binding-*
          path: packages/js/binding/pkg
          merge-multiple: true

      - name: Verify merged native binding artifacts
        shell: bash
        run: |
          ls -la packages/js/binding/pkg
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            test -f "packages/js/binding/pkg/$file"
          done <<< "$REQUIRED_NATIVE_NODE_FILES"

      - name: Generate Test Data
        run: |
          bun install
          bun run gen:test-data

      - name: Generate Script Data
        run: |
          cd packages/js
          bun install
          bun run make-script-data

      - name: Build WASM
        run: |
          cd packages/js/wasm
          wasm-pack build --profile wasm-release --target web

      - name: Build package with merged native artifacts
        working-directory: packages/js
        run: |
          bun run build
          bun run check
          bun run test:run -- tests/check_binding.test.ts

      - name: Verify packaged native artifacts
        shell: bash
        run: |
          ls -la packages/js/dist/native
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            test -f "packages/js/dist/native/$file"
          done <<< "$REQUIRED_NATIVE_NODE_FILES"

      - name: Pack
        working-directory: packages/js
        run: |
          mkdir -p ../../npm-package
          npm pack --pack-destination ../../npm-package
          ls -la ../../npm-package

      # the built package and the tarball as a user installs it, before anything is published
      - name: Runtime, Package and Workers Checks
        working-directory: packages/js
        run: |
          bun run test:runtime:dist
          node scripts/package_check.mjs --tarball ../../npm-package/*.tgz
          bun run test:workerd

      - name: Upload the package tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm-package/*.tgz
          if-no-files-found: error

  # The tarball installed and loaded on every platform with a GitHub runner: each loads its own
  # native binary (`import` and `require` of every entry, see `scripts/package_check.mjs`)
  verify-package:
    name: Verify the package (${{ matrix.name }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            runtimes: node,bun
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            runtimes: node,bun
          - name: macos-x64
            runner: macos-15-intel
            runtimes: node,bun
          - name: macos-arm64
            runner: macos-14
            runtimes: node,bun
          - name: windows-x64
            runner: windows-latest
            runtimes: node,bun
          - name: windows-arm64
            runner: windows-11-arm
            # Bun is checked on the other platforms
            runtimes: node
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repo (for the check script)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        if: contains(matrix.runtimes, 'bun')
        uses: oven-sh/setup-bun@v2

      - name: Download the package tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package

      - name: Package Check
        shell: bash
        run: |
          TARBALL=$(ls npm-package/*.tgz)
          node packages/js/scripts/package_check.mjs --tarball "$TARBALL" --runtimes ${{ matrix.runtimes }}

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [package, verify-package]
    environment:
      name: release

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Download the package tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package

      # the verified tarball's files, published as they are (nothing is built again)
      - name: Unpack the package
        shell: bash
        run: |
          tar -xzf npm-package/*.tgz -C npm-package
          ls -la npm-package/package

      - name: Read package.json version (publish job)
        id: pkg_version_publish
        shell: bash
        run: |
          VERSION=$(jq -r '.version' npm-package/package/package.json)
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "Failed to read version from package.json"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version (publish job): $VERSION"

      - name: Resolve npm dist-tag
        id: npm_dist_tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            DIST_TAG="${{ inputs.npm_dist_tag }}"
          else
            # Heuristic: prerelease versions (e.g. 1.2.3-beta.1) publish under beta tag by default.
            VERSION="${{ steps.pkg_version_publish.outputs.VERSION }}"
            if [[ "$VERSION" == *-* ]]; then
              DIST_TAG="beta"
            else
              DIST_TAG="latest"
            fi
          fi

          if [[ -z "$DIST_TAG" ]]; then
            echo "npm dist-tag is empty; aborting."
            exit 1
          fi

          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved npm dist-tag: $DIST_TAG"

      - name: Publish to npm
        run: npm publish ./npm-package/package --tag "${{ steps.npm_dist_tag.outputs.DIST_TAG }}"
