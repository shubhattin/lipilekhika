name: Desktop App CI

# The desktop app's macOS build: the system wide typing there (the event tap) is compiled and
# tested only on a Mac. Windows and Linux are built by the release workflow.
on:
  pull_request:
    paths:
      - "desktop-client/**"
      - "packages/rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop_ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pc-app-macos

      - name: Clippy
        run: cargo clippy -p lipilekhika-ui --all-targets -- -D warnings

      - name: Test
        run: cargo test -p lipilekhika-ui

      # the disk image as the release makes it (signed ad hoc here), checked by the bundle script
      - name: Build and bundle
        run: |
          cargo build --release -p lipilekhika-ui
          sh desktop-client/packaging/bundle-macos.sh target/release/lipilekhika-ui target/release/lipilekhika-ui 0.0.0 dist
