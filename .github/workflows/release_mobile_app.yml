name: Release Mobile App

# The native Android app (mobile-app/android, Kotlin + Jetpack Compose). The old Flutter app's
# workflow is kept in mobile-app/flutter/release_mobile_app.yml.

on:
  push:
    tags:
      - "mobile-app@v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach release to (e.g. mobile-app@v1.2.3); for a dry run it does not have to exist"
        required: true
      dry_run:
        description: "Dry run: run the whole workflow (build, tests, checks), but publish / upload nothing"
        type: boolean
        default: false

permissions:
  contents: write # Required for uploading to releases

env:
  MOBILE_APP_POSTHOG_KEY: ${{ vars.MOBILE_APP_POSTHOG_KEY }}
  # Build tools are pinned, so that a new release of one can not break the build of an unchanged commit.
  CARGO_NDK_VERSION: 4.1.2

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # The version is app.versionName in mobile-app/android/gradle.properties
      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^app\.versionName=//p' mobile-app/android/gradle.properties | tr -d '\r')
          if [[ -z "$VERSION" ]]; then
            echo "Could not determine version from mobile-app/android/gradle.properties"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      # Resolve release tag (from input on workflow_dispatch, else from pushed tag)
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "TAG=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      # Verify tag contains the app version
      - name: Verify tag matches version
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.TAG }}"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Resolved TAG = $TAG"
          echo "App VERSION = $VERSION"
          if [[ "$TAG" != *"$VERSION"* ]]; then
            echo "Tag ($TAG) does not contain version ($VERSION). Aborting build."
            exit 1
          fi

      # Normalize the tag to the canonical `mobile-app@v<version>` form
      - name: Normalize tag for release upload
        id: normalized_tag
        shell: bash
        run: |
          RAW_TAG="$(echo -n "${{ steps.release_tag.outputs.TAG }}" | tr -d '\r\n')"
          VERSION="$(echo -n "${{ steps.get_version.outputs.VERSION }}" | tr -d '\r\n')"
          VERSION="${VERSION#v}"
          if [[ "$RAW_TAG" == mobile-app@* ]]; then
            TAG_SUFFIX="${RAW_TAG#mobile-app@}"
            TAG_SUFFIX="${TAG_SUFFIX#v}"
            NORMALIZED_TAG="mobile-app@v${TAG_SUFFIX}"
          else
            NORMALIZED_TAG="mobile-app@v${VERSION}"
          fi
          echo "Normalized TAG=$NORMALIZED_TAG"
          echo "TAG=$NORMALIZED_TAG" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # the NDK of the Kotlin package (cargo-ndk uses it)
      - name: Install the NDK
        run: sdkmanager --install "ndk;$(grep -oP 'ndkVersion = "\K[^"]+' packages/kotlin/lipilekhika/build.gradle.kts)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV

      # The split APKs (one per ABI, version code ABI × 1000 + versionCode as the Flutter app had),
      # the universal APK, and the AAB for the Play Console. The AAB is built in a second run without
      # the ABI splits: AGP can not build a bundle while they are on (issuetracker.google.com/402800800)
      - name: Build release APKs and AAB
        working-directory: mobile-app/android
        run: |
          ./gradlew --console=plain spotlessCheck :app:assembleRelease -Papp.splitAbi=true
          ./gradlew --console=plain :app:bundleRelease

      - name: Rename outputs
        id: outputs
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          APK_DIR=mobile-app/android/app/build/outputs/apk/release
          OUT=mobile-app/android/app/build/release-files
          mkdir -p "$OUT"
          ls -la "$APK_DIR"
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            mv "$APK_DIR/app-$abi-release.apk" "$OUT/lipilekhika_${VERSION}_${abi}.apk"
          done
          mv mobile-app/android/app/build/outputs/bundle/release/app-release.aab "$OUT/lipilekhika_${VERSION}.aab"
          ls -la "$OUT"
          echo "OUT=$OUT" >> $GITHUB_OUTPUT

      # Each split APK has only its ABI's native libraries (the Rust library and nothing else)
      - name: Verify native libraries
        shell: bash
        run: |
          OUT="${{ steps.outputs.outputs.OUT }}"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$OUT/lipilekhika_${VERSION}_${abi}.apk" | grep "lib/" | tee /tmp/libs.txt
            grep -q "lib/$abi/liblipilekhika_kotlin.so" /tmp/libs.txt || { echo "missing the $abi library"; exit 1; }
            if grep -v "lib/$abi/" /tmp/libs.txt | grep -q "\.so"; then echo "other ABIs in the $abi APK"; exit 1; fi
          done

      - name: Upload APKs and AAB as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: ${{ steps.outputs.outputs.OUT }}/*
          retention-days: 30

      # Upload the APKs to the GitHub release (with --clobber to allow re-runs);
      # a dry run only keeps them as the workflow artifacts above
      - name: Upload APKs to release
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.normalized_tag.outputs.TAG }}"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          OUT="${{ steps.outputs.outputs.OUT }}"
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            gh release upload "$TAG" "$OUT/lipilekhika_${VERSION}_${abi}.apk" --clobber
          done
          echo "Uploaded the APKs to release $TAG"
