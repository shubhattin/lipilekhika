name: Python Package CI

on:
  push:
    paths:
      - 'packages/rust/**'
      - 'lipi_script_data/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'test_data/**'
      - 'scripts/**'
      - 'packages/python/**'
      - '.github/workflows/python_ci.yml'
  workflow_dispatch:

env:
  # CI builds compile fast: the release profile's fat LTO and single codegen unit (for the
  # published packages) only slow the build down here, the code is still optimized (opt-level 3)
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

# The cargo caches (Swatinem/rust-cache: the dependencies' builds, one per job) are saved on main
# only; the other branches start from main's.
jobs:
  type_build_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        name: Setup Bun
      - name: Generate Script Data
        run: |
          bun install --frozen-lockfile --filter './' --filter '@lipilekhika/script-data'
          bun run make-script-data

      # Rust
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3 # no major (v10) tag is published
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable 
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
  
      - name: Build and Check
        run: |
          cd packages/python
          uv sync
          uv build
          uvx ty check
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Generate Test Data
        run: |
          bun install --frozen-lockfile --filter './'
          bun run gen:test-data
      - name: Generate Script Data
        run: |
          bun install --frozen-lockfile --filter './' --filter '@lipilekhika/script-data'
          bun run make-script-data

      # Compile Python Bindings using Maturin from Rust
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3 # no major (v10) tag is published
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable 
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile Python Bindings
        run: |
          cd packages/python
          uv sync
          uvx maturin develop --release
        
      - name: Run Tests
        run: |
          cd packages/python
          uv run pytest