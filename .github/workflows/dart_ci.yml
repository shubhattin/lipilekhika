name: Dart Package CI

on:
  push:
    paths:
      - 'packages/dart/**'
      - 'packages/rust/**'
      - 'lipi_script_data/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'test_data/**'
      - 'scripts/**'
      - '.github/workflows/dart_ci.yml'
  workflow_dispatch:

# a newer push to the same branch cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # keep in sync with `flutter_rust_bridge` in packages/dart/binding/Cargo.toml (and pubspec.lock)
  FRB_CODEGEN_VERSION: 2.11.1

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Setup Bun for test data generation
      - uses: oven-sh/setup-bun@v2
        name: Setup Bun

      - name: Generate Test Data
        run: |
          bun install --frozen-lockfile --filter './'
          bun run gen:test-data

      # Setup Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The generated bindings only depend on the binding crate's API, the codegen config and
      # version, so they are reused until one of those changes (skipping install + generate)
      - name: Cache Dart FFI bindings
        id: frb-cache
        uses: actions/cache@v6
        with:
          path: |
            packages/dart/lipilekhika/lib/src/rust
            packages/dart/binding/src/frb_generated.rs
          key: ${{ runner.os }}-frb-${{ env.FRB_CODEGEN_VERSION }}-${{ hashFiles('packages/dart/binding/src/api/**', 'packages/dart/binding/src/lib.rs', 'packages/dart/binding/Cargo.toml', 'packages/dart/lipilekhika/flutter_rust_bridge.yaml', 'packages/dart/lipilekhika/pubspec.yaml', 'packages/dart/lipilekhika/pubspec.lock') }}

      # Prebuilt release binary (cargo install compiled it from source on every run)
      - name: Install flutter_rust_bridge_codegen
        if: steps.frb-cache.outputs.cache-hit != 'true'
        run: |
          FILE="flutter_rust_bridge_codegen-x86_64-unknown-linux-musl-v${FRB_CODEGEN_VERSION}.tgz"
          URL="https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v${FRB_CODEGEN_VERSION}/${FILE}"
          curl -fsSLO "$URL"
          curl -fsSLO "$URL.sha256"
          echo "$(cat "$FILE.sha256")  $FILE" | sha256sum -c
          tar -xzf "$FILE" -C ~/.cargo/bin flutter_rust_bridge_codegen
          rm "$FILE" "$FILE.sha256"
          flutter_rust_bridge_codegen --version

      # Generate Dart FFI bindings
      - name: Generate Dart bindings
        if: steps.frb-cache.outputs.cache-hit != 'true'
        run: |
          cd packages/dart/lipilekhika
          flutter_rust_bridge_codegen generate

      # Build Rust library
      - name: Build Rust bindings
        run: |
          cd packages/dart/binding
          cargo build --release

      # Install Dart dependencies
      - name: Install Dart dependencies
        run: |
          cd packages/dart/lipilekhika
          flutter pub get

      # Copy compiled library
      - name: Copy compiled library
        run: |
          cd packages/dart/lipilekhika
          cp ../../../target/release/libdart_binding.so .

      # Run tests
      - name: Run Dart Tests
        run: |
          cd packages/dart/lipilekhika
          LD_LIBRARY_PATH=. dart test
