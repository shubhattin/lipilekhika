name: JS Package CI

on:
  push:
    paths:
      - "packages/js/**"
      - "lipi_script_data/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "packages/rust/**"
      - "test_data/**"
      - "scripts/**"
      - ".github/workflows/js_ci.yml"
  workflow_dispatch:

jobs:
  type_build_check:
    # strategy:
    #   matrix:
    #     os: [ubuntu-latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        name: Setup Bun

      # Compile wasm
      - name: Generate Script Data
        run: |
          bun install --frozen-lockfile
          bun run make-script-data
      ## Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # prebuilt wasm-pack (jetli/wasm-pack-action runs on the deprecated Node.js 16).
      # `wasm-pack build --profile` needs wasm-pack >= 0.12; pinned to the version verified locally
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - name: Build WASM
        run: |
          cd packages/js/wasm
          wasm-pack build --profile wasm-release --target web

      - name: Build Node Binding
        run: |
          cd packages/js/binding
          ./gen_node_bind.sh

      - name: Typescript and Build Check
        run: |
          cd packages/js
          bun run build
          bun run check

      # Loads the JS, WASM and N-API variants under Node and Bun (source and built dist).
      # Guards against a runtime exiting early while the WASM module loads (seen with Bun).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Runtime Check (source, vite-node + bun)
        working-directory: packages/js
        run: bun run test:runtime
      - name: Runtime Check (dist, node + bun)
        working-directory: packages/js
        run: bun run test:runtime:dist
      # `lipilekhika/wasm` in the Cloudflare Workers runtime (workerd via `wrangler dev`), installed
      # from the packed tarball like a user's Worker (export conditions + the shipped `.wasm` file)
      - name: Workers Runtime Check (dist, workerd)
        working-directory: packages/js
        run: bun run test:workerd
      # The packed tarball installed like a user's: every entry with `import` and `require` under
      # Node and Bun (pure JS, WASM, N-API), and its types (ESM + CommonJS, bundler)
      - name: Package Check (packed tarball, node + bun)
        working-directory: packages/js
        run: bun run test:package
  tests:
    # Does not depend on wasm (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Generate Test Data
        run: |
          bun install --frozen-lockfile
          bun run gen:test-data

      - name: Generate Script Data
        run: |
          bun install --frozen-lockfile
          bun run make-script-data

      ## Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # prebuilt wasm-pack (jetli/wasm-pack-action runs on the deprecated Node.js 16).
      # `wasm-pack build --profile` needs wasm-pack >= 0.12; pinned to the version verified locally
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - name: Build WASM
        run: |
          cd packages/js/wasm
          wasm-pack build --profile wasm-release --target web

      - name: Build Node Binding
        run: |
          cd packages/js/binding
          ./gen_node_bind.sh
      - name: Test and Coverage
        working-directory: packages/js
        # vitest, the bun test runner lacks vi.setSystemTime (fake clock in the typing tests)
        run: bun run coverage
      - name: Lint
        working-directory: packages/js
        run: bun lint
