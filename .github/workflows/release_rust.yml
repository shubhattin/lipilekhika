name: Release Rust Package

on:
  push:
    tags:
      - "rust-lib@v*"
  workflow_dispatch:
    # This would work only if the package version was already not published to crates.io
    inputs:
      tag:
        description: "Existing tag to attach release to (e.g. rust-lib@v1.2.3); for a dry run it does not have to exist"
        required: true
      dry_run:
        description: "Dry run: run the whole workflow (build, tests, checks), but publish / upload nothing"
        type: boolean
        default: false

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for uploading to releases

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Test data for `cargo test` (script data artifacts are committed)
      - uses: oven-sh/setup-bun@v2
      - name: Generate Test Data
        run: |
          bun install --frozen-lockfile --filter './'
          bun run gen:test-data

      # Rust setup
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test and Build Rust Package
        run: |
          cd packages/rust
          cargo build --release
          cargo test --release

      # Extract package version from packages/rust/Cargo.toml
      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^[[:space:]]*version[[:space:]]*=/ {print $2; exit}' packages/rust/Cargo.toml)
          if [[ -z "$VERSION" ]]; then
            echo "Could not determine version from packages/rust/Cargo.toml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      # Resolve release tag (from input on workflow_dispatch, else from pushed tag)
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "TAG=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      # Verify tag contains the package version
      - name: Verify tag matches version
        id: verify_tag
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.TAG }}"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Resolved TAG = $TAG"
          echo "Package VERSION = $VERSION"
          if [[ "$TAG" != *"$VERSION"* ]]; then
            echo "Tag ($TAG) does not contain version ($VERSION). Aborting publish."
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        if: ${{ !inputs.dry_run }}
        id: auth

      # a dry run goes through `cargo publish --dry-run`: packages and builds the crate, uploads nothing
      - name: Publish to crates.io${{ inputs.dry_run && ' (dry run)' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cd packages/rust
          cargo publish -p lipilekhika ${{ inputs.dry_run && '--dry-run' || '' }}

  build-binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: parivartak-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: parivartak-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: parivartak-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: parivartak-windows-x86_64.exe

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Rust setup (with targets)
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build binary
        run: |
          cd packages/rust
          cargo build --release --example parivartak --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mv "target/${{ matrix.target }}/release/examples/parivartak" "${{ matrix.asset_name }}"

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mv "target/${{ matrix.target }}/release/examples/parivartak.exe" "${{ matrix.asset_name }}"

      # Extract package version (each job runs independently)
      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^[[:space:]]*version[[:space:]]*=/ {print $2; exit}' packages/rust/Cargo.toml)
          if [[ -z "$VERSION" ]]; then
            echo "Could not determine version from packages/rust/Cargo.toml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "TAG=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Verify tag matches version
        id: verify_tag
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.TAG }}"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Resolved TAG = $TAG"
          echo "Package VERSION = $VERSION"
          if [[ "$TAG" != *"$VERSION"* ]]; then
            echo "Tag ($TAG) does not contain version ($VERSION). Aborting upload."
            exit 1
          fi

      # Normalize the tag to the canonical `rust-lib@v<version>` form
      - name: Normalize tag for release upload
        id: normalized_tag
        shell: bash
        run: |
          RAW_TAG="${{ steps.release_tag.outputs.TAG }}"
          VERSION_RAW="${{ steps.get_version.outputs.VERSION }}"
          RAW_TAG="$(echo -n "$RAW_TAG" | tr -d '\r\n')"
          VERSION="$(echo -n "$VERSION_RAW" | tr -d '\r\n')"
          VERSION="${VERSION#v}"

          if [[ "$RAW_TAG" == rust-lib@* ]]; then
            TAG_SUFFIX="${RAW_TAG#rust-lib@}"
            TAG_SUFFIX="${TAG_SUFFIX#v}"
            NORMALIZED_TAG="rust-lib@v${TAG_SUFFIX}"
          else
            NORMALIZED_TAG="rust-lib@v${VERSION}"
          fi

          echo "Normalized TAG=$NORMALIZED_TAG"
          echo "TAG=$NORMALIZED_TAG" >> $GITHUB_OUTPUT

      # a dry run keeps the binary as a workflow artifact instead
      - name: Upload binary as artifact (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 7

      - name: Upload binary to release
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.normalized_tag.outputs.TAG }}"
          ASSET="${{ matrix.asset_name }}"
          echo "Uploading $ASSET to release $TAG"
          gh release upload "$TAG" "$ASSET" --clobber
