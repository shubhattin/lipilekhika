[package]
name = "kotlin_binding"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# the library the Kotlin code loads (System.loadLibrary): liblipilekhika_kotlin.so
name = "lipilekhika_kotlin"
crate-type = ["cdylib"]

[dependencies]
lipilekhika = { path = "../../rust", features = ["std"] }
jni = { version = "0.21.1", default-features = false }
