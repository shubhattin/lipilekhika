[versions]
agp = "9.5.1"
kotlin = "2.4.21"
junit = "4.13.2"
snakeyaml-engine = "3.2"
spotless = "8.11.0"
ktfmt = "0.64"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
# only puts this Kotlin version on the build classpath: AGP 9 compiles Kotlin itself (built-in Kotlin)
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
