[package]
name = "node_binding"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# `std` for the idle auto clear of the typing context (`auto_context_clear_time_ms`)
lipilekhika = { path = "../../rust", features = ["std"] }
napi = "3.8.3"
napi-derive = "3.5.2"

[build-dependencies]
napi-build = "2.3.1"
