[package]
name = "lipilekhika-macros"
license = "MIT"
description = "Procedural macros used internally by the lipilekhika crate"
homepage = "https://lipilekhika.in"
repository = "https://github.com/shubhattin/lipilekhika"
documentation = "https://docs.rs/lipilekhika"
keywords = ["indic-scripts", "transliteration"]
categories = ["text-processing", "localization"]

version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
include = ["src/**/*", "Cargo.toml", "README*"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", default-features = false, features = [
    "parsing",
    "printing",
    "proc-macro",
] }
