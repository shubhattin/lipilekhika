# replace_pancham_varga_varna_with_anusvAra with non-BMP source scripts (Brahmi, Sharada, Granth, Siddham).
# Each character of these scripts takes two UTF-16 units in JS; the input rule check
# (`matchPrevKramaSequence`) used to step back one unit and land inside a surrogate pair,
# so the rule never matched and the output kept the pancham varNa + halant (e.g. गङ्गा).
