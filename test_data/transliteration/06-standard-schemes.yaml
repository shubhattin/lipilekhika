  to: SLP1
  input: ऍ ऑ ॻ ॼ ॾ ॿ
  output: e o ga ja qa ba
- index: 9
  from: Devanagari
  to: Harvard-Kyoto
  input: ऍ ऑ ॻ ॼ ॾ ॿ
  output: e o ga ja Da ba
