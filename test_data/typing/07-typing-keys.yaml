# य़ / য় (ya + nukta) is typed with `yz`, like the other nukta letters (kz, jz, Dz).
# Without a key of its own `yz` came out as y + z (য্জ়্)
- index: 0
  text: samayza yza yzA
  output: সময় য় য়া
  script: Bengali
  preserve_check: true
- index: 1
  text: samayza yza
  output: समय़ य़
  script: Devanagari
  preserve_check: true
- index: 2
  text: yzadi
  output: ଯଦି
  script: Odia
  preserve_check: true

# Independent candra vowels ऍ ऑ (and their mAtrAs) are typed with `aiI` / `auU`, in the scripts
# which have them. Other scripts keep `aiI` as ai + I
- index: 3
  text: aiI auU kaiI kauU
  output: ऍ ऑ कॅ कॉ
  script: Devanagari
- index: 4
  text: aiI auU kaiI kauU
  output: ऍ ऑ कॅ कॉ
  script: Purna-Devanagari
- index: 5
  text: aiI auU kaiI kauU
