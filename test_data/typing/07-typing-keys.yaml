# Standalone ai / au mAtrA keys `.ai` `.au`, like `.A` `.i` ... (the input was dropped: k.ai -> क्)
- index: 8
  text: .ai .au k.ai k.au
  output: ै ौ क्ै क्ौ
  script: Devanagari

# `x` (क्ष) is a key, it was replaced by kSh in the input before the keys were split, so its
# k joined the key before it: #x -> ꣬ष् (#k is ꣬), Malayalam .x -> ൿഷ് (.k is the chillu ൿ)
- index: 12
  text: "# #x .x kx xa xi"
  output: "# #क्ष् ।क्ष् क्क्ष् क्ष क्षि"
  script: Devanagari
- index: 13
  text: .x xa
  output: ।ക്ഷ് ക്ഷ
