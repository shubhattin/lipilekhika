# Halant of a consonant must come before the next character (#151)
#
# After a consonant the halant is held back, as the next key decides whether it is needed
# (k -> क, ka -> क, kk -> क्क). It is emitted when the next character is processed.
# Some paths emitted the next character first and only then the pending halant, so it
# landed after that character (kqq -> कq् instead of क्q).
# An unknown character was already correct (kqa -> क्qअ), these cases follow it.

# Custom script characters: `qq` (q), `.q` (ZWJ)
# k.qSha -> क् + ZWJ + ष: the half form of क
- index: 0
  text: kqq k.qSha
  output: "क्q क्‍ष"
  script: Devanagari
# In Sinhala a conjunct needs al-lakuna + ZWJ (ක්‍ෂ), not ZWJ + al-lakuna
- index: 1
  text: k.qSha
  output: "ක්‍ෂ"
  script: Sinhala
# Tamil numeral custom characters `.10`, `.100`, `.1000` after a consonant
- index: 2
  text: k.10 k.100 k.1000
  output: க்௰ க்௱ க்௲
  script: Tamil

# Prefix-only keys which are not characters by themselves (`S` of `Sh`, `c` of `ch`)
# are emitted as they are, after the halant of the previous consonant
- index: 3
  text: kSa kca kc
  output: क्Sअ क्cअ क्c
  script: Devanagari

# ASCII digits with native numerals off
- index: 4
  text: k0 k0a
  output: क्0 क्0अ
  script: Devanagari
  options:
    useNativeNumerals: false
- index: 5
  text: ram5
  output: రమ్5
  script: Telugu
  options:
    useNativeNumerals: false
# with native numerals on this was already correct
- index: 6
  text: k0 k0a
  output: क्० क्०अ
  script: Devanagari

# `.h` (halant key) after a consonant adds only one halant, not two (क््)
- index: 7
  text: k.h kh.h k.hSha
  output: क् ख् क्ष
  script: Devanagari
