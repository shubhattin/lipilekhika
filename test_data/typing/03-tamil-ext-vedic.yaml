# Tamil-Extended: Vedic svara typed after a vowel ending in a superscript (#152)
#
# In Tamil-Extended the Vedic svara (॒ ॑ ᳚ ᳛) goes before the superscript number (² ³ ⁴),
# same as transliterating दे॒वाँ॑ or the one-shot (non incremental) output.
# `RR` (ॠ = ரூ²), `LRR` (ॡ = ல்ரீ²) and `MM` (ँ = ஂ²) have no further key, so the typing
# context was cleared after them and the svara typed next went after the superscript.

- index: 0
  text: RR' LRR_
  output: ரூ॑² ல்ரீ॒²
  script: Tamil-Extended
- index: 1
  text: dE_vAMM'
  output: தே॒³வாஂ॑²
  script: Tamil-Extended
# these already worked (`R` has a next key, `kRR` is a mAtrA after a consonant)
- index: 2
  text: R' kRR' LR_
  output: ரு॑² க்ரூ॑² ல்ரி॒²
  script: Tamil-Extended
