[package]
name = "lipilekhika-ui"
version = "1.0.11"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "0.9.1"
lipilekhika = { path = "../packages/rust", features = ["std"] }
crossbeam-channel = "0.5.15"
tray-icon = { version = "0.21.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
octocrab = { version = "0.38", features = ["timeout"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = [
    "rustls-tls",
], default-features = false }
posthog-rs = { version = "0.3.5", default-features = false }
dirs = "6.0.0"
uuid = { version = "1.19", features = ["v4"] }
unicode-general-category = "1"
# one running app: a second start hands its request to the first (named pipe / unix socket)
interprocess = "2"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# tray-icon draws the tray menu with GTK on Linux, its thread runs the GTK main loop
gtk = "0.18"
glib = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Globalization",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    # the portable app's fonts (AddFontResourceEx)
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
foreign-types = "0.5"

[build-dependencies]
embed-resource = "2"
dotenvy = "0.15.7"
static_vcruntime = "3"
